[project]
name = "smartlading"
version = "0.1.0"
description = "SmartLading 采购决策副驾驶：agent 层（风险信号提取、推荐解释、供应商谈判）"
readme = "README.md"
authors = [
    { name = "coolgenerator", email = "97279861+coolgenerator@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
